name: Hermes Ecosystem CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: session-launcher

      - name: Checkout sibling projects
        run: |
          git clone https://github.com/oahcom/hermes-session-role.git hermes-session-roles
          git clone https://github.com/oahcom/session-pipe.git session-pipeline

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run ecosystem health check
        run: |
          cd session-launcher
          python3 src/ecosystem_health.py --ci --json | tee health_report.json

      - name: Run project tests
        run: |
          cd session-launcher && python3 -m pytest tests/test_signals.py tests/test_check_shell.py tests/test_mcp_settings.py -q --timeout=60
          cd hermes-session-roles && python3 tests/test_registry.py && python3 tests/test_validate_roles_reverse.py
          cd session-pipeline && PYTHONPATH=src python3 -m pytest tests/test_router.py -v --timeout=30

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: session-launcher/health_report.json
