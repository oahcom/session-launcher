name: Hermes Ecosystem CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: session-launcher

      - name: Checkout sibling projects
        run: |
          git clone https://github.com/oahcom/hermes-session-role.git hermes-session-roles
          git clone https://github.com/oahcom/session-pipe.git session-pipeline

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run ecosystem health check
        run: |
          cd session-launcher
          python3 src/ecosystem_health.py --ci --json | tee health_report.json

      - name: Run project tests
        run: |
          # 跑全量套件，不手列文件名：手列清单会静默漏掉新增测试（DR-008「清单手抄
          # 代码」——曾漏掉 tests/unit/test_intent_classifier.py 等整个 unit 目录）。
          # session-pipeline 的 contract_updater 等用例依赖同级 hermes-session-roles
          # 目录，本 job 已 clone 到同级，故可跑全量。
          cd session-launcher && python3 -m pytest tests/ -q --timeout=60
          cd hermes-session-roles && python3 -m pytest tests/ -q
          cd session-pipeline && PYTHONPATH=src python3 -m pytest tests/ -q --timeout=60

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: session-launcher/health_report.json
