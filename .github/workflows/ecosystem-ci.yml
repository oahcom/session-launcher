name: Hermes Ecosystem CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: session-launcher

      - name: Checkout sibling projects
        run: |
          git clone https://github.com/your-org/hermes-session-roles.git
          git clone https://github.com/your-org/session-pipeline.git

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run ecosystem health check
        run: |
          cd session-launcher
          python3 src/ecosystem_health.py --ci --json | tee health_report.json

      - name: Run project tests
        run: |
          cd session-launcher && python3 -m pytest tests/test_6dimension_deep_qa.py -v --timeout=30 || true
          cd hermes-session-roles && python3 tests/test_search.py
          cd session-pipeline && PYTHONPATH=src python3 -m pytest tests/test_router.py -v --timeout=30 || true

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: session-launcher/health_report.json
